name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@main
    - run: cargo binstall --no-confirm cargo-shear
    - run: cargo shear
